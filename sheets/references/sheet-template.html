<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHEET TITLE</title>
<meta name="description" content="ONE LINE: what this sheet is for">
<!-- People's cell edits live here: one record per person, everyone sees everyone's. -->
<meta name="spacesheep:records" content='{"cells":{"mode":"shared"}}'>
<style>
:root{--ink:#1f2328;--muted:#52514a;--line:#d8dadd;--head:#f3f4f6;--sel:#1a5fd0;--chg:#b25e00;--mine:#0f7b55;

--paper:#fff;--cell:#fff;--cell-hdr:#fafafa;--rule:#e5e7eb;--edge:rgba(31,35,40,.16);color-scheme:light dark;
font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper)}
/* Night: the same tokens, night values; nothing below names a colour of its own. */
@media (prefers-color-scheme:dark){:root{--ink:#e6e8eb;--muted:#a9adb3;--line:#3a3f46;--head:#23272d;--sel:#7aa8ff;--chg:#f0a14a;--mine:#3fbf8c;
--bad:#4a1f1d;--bad-ink:#ffb4ae;--warn:#463a12;--warn-ink:#ffd978;--good:#173a2a;--good-ink:#8fe0b5;--accent:#7aa8ff;
--paper:#16181c;--cell:#1b1e23;--cell-hdr:#20242a;--rule:#2c3036;--edge:rgba(0,0,0,.55)}}
*{box-sizing:border-box}
body{margin:0;padding:0 clamp(12px,3vw,28px) 40px}
header{padding:20px 0 8px}
h1{font-size:clamp(22px,4vw,30px);line-height:1.2;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 10px;max-width:70ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.bar button{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--cell);color:var(--ink);font:inherit;cursor:pointer}
.bar button:hover{border-color:var(--accent)}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--bad-ink);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:6px}
.tabs button{min-height:42px;padding:0 16px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;background:none;font:inherit;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--cell);border-color:var(--line);color:var(--ink);font-weight:600;margin-bottom:-1px}
.fx{display:flex;gap:8px;align-items:center;margin:8px 0}
.fx .addr{min-width:72px;font:600 13px ui-monospace,Menlo,monospace;color:var(--muted)}
.fx input{flex:1;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--cell);color:var(--ink);font:14px ui-monospace,Menlo,monospace}
.fx input:disabled{background:var(--head)}
.gridbox{position:relative}
.wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px;overscroll-behavior-x:contain}
.gridbox::after{content:"";position:absolute;top:1px;right:1px;bottom:1px;width:32px;border-radius:0 8px 8px 0;background:linear-gradient(to right,transparent,var(--edge));pointer-events:none;opacity:0;transition:opacity .15s}
.gridbox.more-right::after{opacity:1}
.more{position:absolute;right:10px;top:7px;z-index:5;font:600 12px system-ui;color:var(--ink);background:var(--cell);border:1px solid var(--line);border-radius:999px;padding:3px 10px;pointer-events:none;display:none}
.gridbox.more-right .more{display:block}
table.grid{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 8px;height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.grid thead th{position:sticky;top:0;background:var(--head);z-index:2;font:600 12px system-ui;color:var(--muted);text-align:center}
.grid th.rn{position:sticky;left:0;background:var(--head);z-index:1;font:600 12px system-ui;color:var(--muted);width:40px;min-width:40px;max-width:40px;text-align:center}
.grid thead th.rn{z-index:3}
.grid thead th:nth-child(2){position:sticky;left:40px;z-index:3}
.grid tbody td:first-of-type{position:sticky;left:40px;z-index:1;border-right-color:var(--muted)}
.grid tr.frozen td:first-of-type{z-index:2}
.grid tr.frozen th.rn{position:sticky;top:34px;left:0;z-index:3}
.grid td{background:var(--cell);cursor:cell}
.grid td.num{text-align:right}
.grid td.hdr{font-weight:600;background:var(--cell-hdr)}
.grid tr.frozen td{position:sticky;top:34px;z-index:1}
.grid td.sel{outline:2px solid var(--sel);outline-offset:-2px}
.grid td.chg{box-shadow:inset 0 0 0 2px var(--chg)}
.grid td.peer{box-shadow:inset 3px 0 0 var(--mine)}
.grid td.bad{background:var(--bad);color:var(--bad-ink)}
.grid td.warn{background:var(--warn);color:var(--warn-ink)}
.grid td.good{background:var(--good);color:var(--good-ink)}
.grid td.error{color:var(--bad-ink);font-weight:600}
.grid td select{width:100%;min-height:30px;border:none;background:transparent;font:inherit}
.grid td input[type=checkbox]{width:20px;height:20px;margin:0;vertical-align:middle}
.legend[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}

.chart h3{font-size:16px;margin:0 0 6px}
.chart svg{width:100%;height:auto;max-width:860px}
.keys{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.keys i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.chart svg text{fill:var(--muted)}.chart svg line{stroke:var(--rule)}
</style>
</head>

  <div class="bar">
    <button type="button" id="dl-csv">Download CSV (this tab)</button>
    <button type="button" id="dl-xlsx">Download .xlsx (all tabs)</button>

<nav class="tabs" id="tabs" role="tablist" aria-label="Tabs"></nav>
